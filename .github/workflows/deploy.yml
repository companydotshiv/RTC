name: Deploy RTC Website to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React App and Deploy to cPanel
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        working-directory: ./ts-app
        run: npm install --force

      - name: 🔨 Build Production Bundle
        working-directory: ./ts-app
        run: npm run build

      - name: 🚀 Deploy to cPanel via FTP (When Secrets Are Configured)
        if: "${{ secrets.CPANEL_FTP_SERVER != '' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./ts-app/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false

      - name: ℹ️ Deployment Status Notice
        if: "${{ secrets.CPANEL_FTP_SERVER == '' }}"
        run: |
          echo "Build completed successfully!"
          echo "To deploy directly from cPanel, go to Git™ Version Control in cPanel and click 'Update from Remote' -> 'Deploy HEAD Commit'."
          echo "Or to enable automatic GitHub FTP deployment, add CPANEL_FTP_SERVER, CPANEL_FTP_USERNAME, and CPANEL_FTP_PASSWORD in GitHub Repository Secrets."
