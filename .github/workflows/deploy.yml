name: Build and Deploy RTC Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React App
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        working-directory: ./ts-app
        run: npm install --force

      - name: 🔨 Build Production Bundle
        working-directory: ./ts-app
        run: npm run build

      - name: 🚀 Deploy to cPanel via FTP
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./ts-app/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false

      - name: ℹ️ Deployment Ready
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
        if: env.FTP_SERVER == ''
        shell: bash
        run: |
          echo "Build completed successfully with zero errors."
          echo "Deployable directly via cPanel Git™ Version Control."
