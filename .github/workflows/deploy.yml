name: Deploy RTC Foods PHP Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Validate PHP & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🔍 Lint PHP Application Files
        run: |
          echo "Checking PHP syntax..."
          find . -maxdepth 3 -name "*.php" -exec php -l {} \;

      - name: 🚀 Deploy to cPanel via FTP
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./
          server-dir: /ranchiwebsite.com/projects/rtc/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: ℹ️ Deployment Ready
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
        if: env.FTP_SERVER == ''
        shell: bash
        run: |
          echo "All PHP files syntax checked successfully."
          echo "Deployable directly via cPanel Git™ Version Control."
